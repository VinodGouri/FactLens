{% extends 'base.html' %}{% block title %}User Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
<div class="card shadow-sm"><div class="card-body p-4">
  <h3 class="mb-3">User login</h3>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ email or '' }}" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-accent w-100">Log in</button>
  </form>
  <p class="small mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div></div></div></div>
{% endblock %}
