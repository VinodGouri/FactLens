{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card shadow-sm"><div class="card-body p-4">
  <h3 class="mb-3">Create account</h3>
  <p class="small text-muted">New accounts must be approved by an administrator before you can log in.</p>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" value="{{ name or '' }}" required maxlength="80"></div>
    <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ email or '' }}" required maxlength="120"></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required minlength="8"><div class="form-text">At least 8 characters with letters and digits.</div></div>
    <div class="mb-3"><label class="form-label">Confirm password</label><input name="confirm" type="password" class="form-control" required></div>
    <button class="btn btn-accent w-100">Register</button>
  </form>
</div></div></div></div>
{% endblock %}
