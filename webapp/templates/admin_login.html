{% extends 'base.html' %}{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
<div class="card shadow-sm border-dark"><div class="card-body p-4">
  <h3 class="mb-3"><i class="bi bi-shield-lock"></i> Admin login</h3>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" value="{{ username or '' }}" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
    <button class="btn btn-dark w-100">Log in as admin</button>
  </form>
</div></div></div></div>
{% endblock %}
